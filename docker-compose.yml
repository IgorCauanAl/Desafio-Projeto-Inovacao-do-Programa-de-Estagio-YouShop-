services:
  youshop-prisma:
    build:
      context: .
      dockerfile: Dockerfile
    image: youshop-prisma:local
    container_name: youshop-prisma
    # A porta do container e sempre 8080; HOST_PORT define a porta no host.
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      # Sem chave, o orquestrador usa o fallback deterministico.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      YOUSHOP_AI_GEMINI_MODEL: ${YOUSHOP_AI_GEMINI_MODEL:-gemini-flash-lite-latest}
      TZ: ${TZ:-UTC}
    restart: unless-stopped
