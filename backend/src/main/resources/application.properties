spring.application.name=youshop-prisma
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.name=youshop-prisma-mcp
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=SSE
spring.ai.mcp.server.instructions=Consultas isoladas e sanitizadas sobre creator, produtor e compradores de campanhas YouShop Prisma.
spring.ai.mcp.server.capabilities.tool=true
spring.ai.mcp.server.annotation-scanner.enabled=false
spring.ai.mcp.server.sse-endpoint=/sse
spring.ai.mcp.server.sse-message-endpoint=/mcp/message

youshop.ai.gemini.model=gemini-flash-lite-latest

logging.level.root=INFO
logging.level.com.youshop.prisma=INFO
logging.level.org.springframework.ai.mcp=INFO
